name: Release App

on:
  push:
    # IGNORES any pre-releases (v0.x.x)
    tags:
      - 'v[1-9]+.[0-9]+.[0-9]+'

jobs:
  release:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: windows-latest
            app_type: exe
          - os: ubuntu-latest
            app_type: deb
          - os: macos-latest
            app_type: dmg

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Jar with Maven
        run: mvn clean package

      # --- UNIFY JAR FILENAME (Works across Windows, Linux, & macOS) ---
      - name: Standardize Built Jar Name
        shell: bash
        run: |
          # Find the compiled fat/executable jar (ignoring sources/javadoc) and copy it as app.jar
          cp target/jflat-*.jar target/app.jar

      # --- WINDOWS BUILD ---
      - name: Generate Windows .exe Installer
        if: matrix.os == 'windows-latest'
        run: |
          $VERSION =$env:GITHUB_REF -replace 'refs/tags/v', ''
          jpackage `
            --type exe `
            --name JFlat `
            --app-version "$VERSION" `
            --input target/ `
            --main-jar app.jar `
            --main-class uk.co.jamesgaskin.jflat.Main `
            --dest output_installer `
            --vendor "James Gaskin"
        shell: powershell

      # --- LINUX BUILD ---
      - name: Generate Linux .deb Package
        if: matrix.os == 'ubuntu-latest'
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          jpackage \
            --type deb \
            --name jflat \
            --app-version "$VERSION" \
            --input target/ \
            --main-jar app.jar \
            --main-class uk.co.jamesgaskin.jflat.Main \
            --dest output_installer \
            --vendor "James Gaskin"

      # --- MACOS BUILD ---
      - name: Generate macOS .dmg Installer
        if: matrix.os == 'macos-latest'
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          jpackage \
            --type dmg \
            --name JFlat \
            --app-version "$VERSION" \
            --input target/ \
            --main-jar app.jar \
            --main-class uk.co.jamesgaskin.jflat.Main \
            --dest output_installer \
            --vendor "James Gaskin"

      - name: Publish GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            output_installer/*.exe
            output_installer/*.deb
            output_installer/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
